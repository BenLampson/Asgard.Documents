server {
    listen 80;
    server_name asgard.benlampson.cn;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name asgard.benlampson.cn;

    ssl_certificate     /etc/nginx/ssl/benlampson.cn.crt;
    ssl_certificate_key /etc/nginx/ssl/benlampson.cn.key;
    ssl_session_cache   shared:ASGARD_DOCS_SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/wwwroot/asgard.benlampson.cn/current;
    index index.html;
    charset utf-8;
    charset_types application/json application/xml text/plain text/markdown;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/markdown application/json application/javascript application/xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~ \.md$ {
        default_type text/markdown;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri/index.html $uri =404;
    }
}
